<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- ========== Font Awesome ========== -->
    <link rel="stylesheet" href="./css/all.min.css" />
    <!-- ========== Bootstrap ========== -->
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <!-- ========== Google Fonts =========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <!-- ========== Main Style ========== -->
    <link rel="stylesheet" href="./css/style.css" />
    <title>Dash Bord</title>
  </head>
  <body>
    <aside class="head">
      <div class="info_account">
        <div class="icon"></div>
        <h3 class="name">Elias Khaled</h3>
      </div>
      <nav class="menu">
        <ul class="list-menu"></ul>
      </nav>
    </aside>
    <main class="content">
      <header class="header">
        <div class="toggle">
          <i class="fa-solid fa-bars"></i>
        </div>
        <div class="search">
          <div class="img-search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <input type="text" placeholder="Search" />
        </div>
        <div class="icons">
          <div class="profile">
            <i class="fa-solid fa-user"></i>
          </div>
          <i class="fa-solid fa-bell"></i>
          <i class="fa-solid fa-message"></i>
        </div>
      </header>
      <div class="container">
        <h1>Quick Stats</h1>
        <div class="cards">
          <div class="total-card">
            <div class="icon">
              <i class="fa-solid fa-clipboard"></i>
            </div>
            <div class="text-card">
              <h4>New Form <n>Submission</n></h4>
              <p>120</p>
            </div>
          </div>
          <div class="total-card">
            <div class="icon">
              <i class="fa-solid fa-list-check"></i>
            </div>
            <div class="text-card">
              <h4>Open Lists</h4>
              <p>40</p>
            </div>
          </div>
          <div class="total-card">
            <div class="icon">
              <i class="fa-solid fa-chart-pie"></i>
            </div>
            <div class="text-card">
              <h4>Completion Rate</h4>
              <p>88%</p>
            </div>
          </div>
          <div class="total-card">
            <div class="icon">
              <i class="fa-regular fa-user"></i>
            </div>
            <div class="text-card">
              <h4>Active Profiles</h4>
              <p>1,200</p>
            </div>
          </div>
        </div>
        <div class="chart-container">
          <div class="chart-card one">
            <div class="text">
              <span>0</span>
              <span>50</span>
              <span>100</span>
              <span>150</span>
              <span>200</span>
              <span>250</span>
            </div>
            <div class="charts">
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Jan</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Feb</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Mar</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Apr</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">May</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Jun</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Jul</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Aug</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Sep</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Oct</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Nov</span>
              </div>
              <div class="chart">
                <div class="blue"></div>
                <div class="red"></div>
                <span class="month">Dec</span>
              </div>
            </div>
          </div>
          <div class="chart-card two"></div>
        </div>
      </div>
    </main>

    <!-- ========== Font Awesome ========== -->
    <script src="./js/all.min.js"></script>
    <!-- ========== Bootstrap ========== -->
    <script src="./js/bootstrap.bundle.min.js"></script>
    <!-- ========== Scroll Reveal ==========
    <script src="./js/scrollreveal.min.js"></script> -->
    <!-- ========== Main JS ========== -->
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
